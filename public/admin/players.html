<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Players | League of Legends Tournament HUD</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-shell">
    <div class="container-fluid">
      <div class="row min-vh-100">
        <aside class="col-12 col-lg-3 col-xxl-2 sidebar p-4">
          <div>
            <span class="eyebrow">League of Legends Tournament HUD</span>
            <h1 class="h3 mt-2 mb-4">Admin Dashboard</h1>
          </div>
          <nav class="nav flex-column gap-2">
            <a class="nav-link" href="/admin/dashboard">Overview</a>
            <a class="nav-link" href="/admin/tournaments">Tournaments</a>
            <a class="nav-link" href="/admin/teams">Teams</a>
            <a class="nav-link active" href="/admin/players">Players</a>
            <a class="nav-link" href="/admin/matches">Matches</a>
            <a class="nav-link" href="/admin/broadcast">Broadcast</a>
            <a class="nav-link" href="/admin/logout">Logout</a>
          </nav>
        </aside>
        <main class="col-12 col-lg-9 col-xxl-10 p-4 p-lg-5 content-area">
          <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
              <span class="eyebrow">Manage</span>
              <h2 class="mb-1">Players</h2>
              <p class="text-secondary mb-0">Manage roster members and player-cam overlay data.</p>
            </div>
            <button class="btn btn-primary" type="button" id="create-btn" data-bs-toggle="modal" data-bs-target="#player-modal">
              New Player
            </button>
          </div>

          <article class="glass-panel p-4">
            <div id="empty-state" class="text-center text-secondary py-5 d-none">
              <p class="mb-0">No players yet. Create your first player to get started.</p>
            </div>
            <div class="table-responsive">
              <table class="table table-dark table-hover align-middle mb-0" id="players-table">
                <thead>
                  <tr>
                    <th>Summoner Name</th>
                    <th>Real Name</th>
                    <th>Role</th>
                    <th>Team</th>
                    <th>Active</th>
                    <th class="text-end">Actions</th>
                  </tr>
                </thead>
                <tbody id="players-body"></tbody>
              </table>
            </div>
          </article>
        </main>
      </div>
    </div>

    <div class="modal fade" id="player-modal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content bg-dark">
          <form id="player-form" enctype="multipart/form-data">
            <div class="modal-header border-secondary">
              <h5 class="modal-title" id="modal-title">New Player</h5>
              <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="player-id" name="id" />
              <div class="mb-3">
                <label class="form-label" for="summoner_name">Summoner Name</label>
                <input class="form-control" id="summoner_name" name="summoner_name" required />
              </div>
              <div class="mb-3">
                <label class="form-label" for="real_name">Real Name</label>
                <input class="form-control" id="real_name" name="real_name" />
              </div>
              <div class="row">
                <div class="col-6 mb-3">
                  <label class="form-label" for="role">Role</label>
                  <select class="form-select" id="role" name="role">
                    <option value="">—</option>
                    <option value="top">Top</option>
                    <option value="jungle">Jungle</option>
                    <option value="mid">Mid</option>
                    <option value="bot">Bot</option>
                    <option value="support">Support</option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label" for="team_id">Team</label>
                  <select class="form-select" id="team_id" name="team_id"></select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="nationality">Nationality (ISO code)</label>
                <input class="form-control" id="nationality" name="nationality" maxlength="2" />
              </div>
              <div class="mb-3 form-check">
                <input class="form-check-input" id="is_active" name="is_active" type="checkbox" checked />
                <label class="form-check-label" for="is_active">Active</label>
              </div>
              <div class="mb-3">
                <label class="form-label" for="photo">Photo</label>
                <input class="form-control" id="photo" name="photo" type="file" accept="image/*" />
              </div>
            </div>
            <div class="modal-footer border-secondary">
              <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Save Player</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/js/apiClient.js"></script>
    <script src="/js/players.js"></script>
  </body>
</html>
