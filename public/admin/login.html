<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | League of Legends Tournament HUD</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-shell admin-login-page">
    <main class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
          <section class="glass-panel p-4 p-lg-5">
            <span class="eyebrow">Milestone 1</span>
            <h1 class="display-6 fw-bold mb-3">Tournament Admin Login</h1>
            <p class="text-secondary mb-4">
              Initial Bootstrap-powered entry screen for local/LAN tournament operations.
            </p>
            <form id="login-form" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label" for="email">Email or username</label>
                <input class="form-control form-control-lg" id="email" name="email" type="text" required />
              </div>
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" required />
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">Open Dashboard Preview</button>
            </form>
            <p class="small text-secondary mt-4 mb-0">
              Authentication, JWT, and role-based access will be implemented in Milestone 2.
            </p>
          </section>
        </div>
      </div>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
