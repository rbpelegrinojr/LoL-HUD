<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | League of Legends Tournament HUD</title>
    <link rel="stylesheet" href="/vendor/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/admin.css" />
  </head>
  <body class="admin-shell admin-login-page">
    <main class="container py-5">
      <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-8 col-lg-5">
          <section class="glass-panel p-4 p-lg-5">
            <span class="eyebrow">Admin Login</span>
            <h1 class="display-6 fw-bold mb-3">Tournament Admin Login</h1>
            <p class="text-secondary mb-4">
              Sign in to manage tournaments, teams, players, matches, and live broadcast overlays.
            </p>
            <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
            <form id="login-form" class="needs-validation" novalidate>
              <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input class="form-control form-control-lg" id="username" name="username" type="text" autocomplete="username" required />
              </div>
              <div class="mb-4">
                <label class="form-label" for="password">Password</label>
                <input class="form-control form-control-lg" id="password" name="password" type="password" autocomplete="current-password" required />
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit">Sign In</button>
            </form>
          </section>
        </div>
      </div>
    </main>
    <script src="/js/login.js"></script>
  </body>
</html>
