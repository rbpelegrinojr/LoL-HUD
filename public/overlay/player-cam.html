<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Player Cam Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 640px;
        height: 120px;
        background: transparent;
        font-family: 'Segoe UI', Arial, sans-serif;
        overflow: hidden;
      }

      #player-cam {
        position: absolute;
        bottom: 12px;
        left: 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(5, 8, 22, 0.82);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        padding: 10px 18px;
        color: #f8f9ff;
      }

      #role-icon {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: rgba(92, 124, 250, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        color: #7f90ff;
      }

      #summoner-name {
        font-size: 22px;
        font-weight: 700;
      }

      #team-tag {
        font-size: 13px;
        color: #aab4d6;
      }
    </style>
  </head>
  <body>
    <div id="player-cam">
      <div id="role-icon">—</div>
      <div>
        <div id="summoner-name">Waiting for player...</div>
        <div id="team-tag"></div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/overlay-player-cam.js"></script>
  </body>
</html>
